<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Contabilidad</title>
    <!-- Logo y acceso directo -->
    <link rel="manifest" href="/Contabilidad-Casa/manifest.json">
    <meta name="theme-color" content="#030712">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .fondo-personalizado {
            background-image: url('fondo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .capa-oscura {
            background-color: rgba(3, 7, 18, 0.85);
            min-height: 100vh;
        }
    </style>
</head>
<body class="fondo-personalizado">
    <div class="capa-oscura min-h-screen pb-24">

        <header class="bg-gray-900/50 border-b border-gray-700 p-4 sticky top-0 z-10 backdrop-blur-sm">
            <div class="max-w-md mx-auto flex justify-between items-center">
                <h1 class="text-base font-bold tracking-wide text-indigo-400">🏡 Fondo Común</h1>
                <select id="select-mes-filtro" class="bg-gray-900 border border-gray-700 text-indigo-300 text-xs px-2 py-1 rounded-full font-bold focus:outline-none"></select>
            </div>
        </header>

        <main class="max-w-md mx-auto p-4 space-y-6">
            <section class="bg-gray-800/80 p-5 rounded-2xl border border-gray-700 shadow-xl text-center">
                <p class="text-xs uppercase tracking-wider text-gray-400 font-bold mb-1">Disponible en Mano</p>
                <p class="text-4xl font-black text-white mb-4 tracking-tight" id="txt-disponible">$0</p>
                <div class="grid grid-cols-3 gap-2 pt-3 border-t border-gray-700">
                    <div><p class="text-[11px] text-gray-400">Ingresó</p><p class="text-sm font-bold text-green-400" id="txt-total-ingresos">$0</p></div>
                    <div class="border-l border-gray-700"><p class="text-[11px] text-gray-400">Salió</p><p class="text-sm font-bold text-red-400" id="txt-total-gastos">$0</p></div>
                    <div class="border-l border-gray-700"><p class="text-[11px] text-gray-400">Ahorro</p><p class="text-sm font-bold text-indigo-400" id="txt-total-ahorros">$0</p></div>
                </div>
            </section>

            <section class="space-y-4">
                <div class="flex justify-between items-center pl-1">
                    <h2 class="text-xs uppercase tracking-wider text-gray-400 font-black">Límites y Alertas</h2>
                    <button id="btn-config-limite" class="text-xs font-bold text-indigo-400 hover:underline"><i class="fa-solid fa-plus mr-1"></i>Agregar Tope</button>
                </div>
                <div id="contenedor-presupuestos" class="space-y-3"></div>
            </section>

            <div class="text-center">
                <button id="btn-toggle-resumen" class="text-xs font-bold text-indigo-400 bg-gray-800 border border-gray-700 px-4 py-2.5 rounded-xl"><i class="fa-solid fa-chart-simple mr-1"></i> Ver Resumen Completo</button>
            </div>

            <section id="seccion-resumen" class="hidden space-y-3 pt-2">
                <h2 class="text-xs uppercase tracking-wider text-gray-400 font-black pl-1">Historial del Mes Seleccionado</h2>
                <div id="lista-movimientos" class="space-y-2"></div>
            </section>
        </main>

        <button id="btn-abrir-modal" class="fixed bottom-6 right-6 bg-indigo-600 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-2xl active:scale-90 transition-transform z-20"><i class="fa-solid fa-plus"></i></button>

        <!-- MODAL CARGA -->
        <div id="modal-carga" class="fixed inset-0 bg-black/70 hidden items-end sm:items-center justify-center p-4 z-30">
            <div class="bg-gray-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 space-y-4 border border-gray-700">
                <div class="flex justify-between items-center border-b border-gray-700 pb-2">
                    <h3 class="font-bold text-white">Nuevo Registro</h3>
                    <button id="btn-cerrar-modal" class="text-gray-400 text-xl"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form id="form-movimiento" class="space-y-4">
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" id="btn-tipo-gasto" class="py-2.5 rounded-xl font-bold border border-red-500 bg-red-500/10 text-red-400">Gasto</button>
                        <button type="button" id="btn-tipo-ingreso" class="py-2.5 rounded-xl font-bold border border-gray-700 bg-transparent text-gray-400">Ingreso</button>
                    </div>
                    <input type="number" id="input-monto" required placeholder="Monto ($)" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl text-white">
                    <select id="input-categoria" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl text-white">
                        <option value="Gasto de Casa">🏠 Gasto de Casa</option><option value="Combustible">🚗 Combustible</option>
                        <option value="Fijos / Servicios">📄 Fijos / Servicios</option><option value="Ahorro">🐷 Ahorro</option>
                        <option value="Sueldo">💰 Ingreso / Sueldo</option><option value="Otros">💡 Otros</option>
                    </select>
                    <input type="text" id="input-detalle" placeholder="Nota" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl text-white">
                    <button type="submit" class="w-full bg-indigo-600 py-3.5 rounded-xl font-bold text-white">Guardar</button>
                </form>
            </div>
        </div>

        <!-- MODAL LÍMITES -->
        <div id="modal-config" class="fixed inset-0 bg-black/70 hidden items-end sm:items-center justify-center p-4 z-30">
            <div class="bg-gray-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 space-y-4 border border-gray-700">
                <div class="flex justify-between items-center border-b border-gray-700 pb-2">
                    <h3 class="font-bold text-white">Agregar Límite</h3>
                    <button id="btn-cerrar-config" class="text-gray-400 text-xl"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form id="form-config" class="space-y-4">
                    <select id="cfg-categoria" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl text-white">
                        <option value="Gasto de Casa">🏠 Gasto de Casa</option><option value="Combustible">🚗 Combustible</option>
                        <option value="Fijos / Servicios">📄 Fijos / Servicios</option><option value="Ahorro">🐷 Ahorro</option>
                        <option value="Otros">💡 Otros</option>
                    </select>
                    <input type="number" id="cfg-monto" required placeholder="Monto máximo ($)" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl text-white">
                    <button type="submit" class="w-full bg-green-600 py-3.5 rounded-xl font-bold text-white">Establecer</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wyqdlihwnwhcsonyspms.supabase.co";
        const SUPABASE_KEY = "sb_publishable_6UD99xo9Z11VXHj1ie2DFg_xjPXQhe6"; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let tipoSeleccionado = 'Gasto';
        let mesSeleccionado = new Date().toISOString().slice(0, 7);

        function inicializarSelector() {
            const selector = document.getElementById('select-mes-filtro');
            const hoy = new Date();
            const nombres = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
            for (let i = -4; i <= 2; i++) {
                let d = new Date(hoy.getFullYear(), hoy.getMonth() + i, 1);
                let val = d.toISOString().slice(0, 7);
                let opt = document.createElement('option');
                opt.value = val; opt.innerText = `${nombres[d.getMonth()]} ${d.getFullYear()}`;
                if (val === mesSeleccionado) opt.selected = true;
                selector.appendChild(opt);
            }
            selector.onchange = (e) => { mesSeleccionado = e.target.value; cargarTodo(); };
        }

        document.getElementById('btn-abrir-modal').onclick = () => document.getElementById('modal-carga').classList.replace('hidden', 'flex');
        document.getElementById('btn-cerrar-modal').onclick = () => document.getElementById('modal-carga').classList.replace('flex', 'hidden');
        document.getElementById('btn-cerrar-config').onclick = () => document.getElementById('modal-config').classList.replace('flex', 'hidden');
        document.getElementById('btn-config-limite').onclick = () => document.getElementById('modal-config').classList.replace('hidden', 'flex');

        const btnGasto = document.getElementById('btn-tipo-gasto'), btnIngreso = document.getElementById('btn-tipo-ingreso');
        btnGasto.onclick = () => { tipoSeleccionado = 'Gasto'; btnGasto.className = "py-2.5 rounded-xl font-bold border border-red-500 bg-red-500/10 text-red-400"; btnIngreso.className = "py-2.5 rounded-xl font-bold border border-gray-700 bg-transparent text-gray-400"; };
        btnIngreso.onclick = () => { tipoSeleccionado = 'Ingreso'; btnIngreso.className = "py-2.5 rounded-xl font-bold border border-green-500 bg-green-500/10 text-green-400"; btnGasto.className = "py-2.5 rounded-xl font-bold border border-gray-700 bg-transparent text-gray-400"; };

        document.getElementById('btn-toggle-resumen').onclick = (e) => {
            const s = document.getElementById('seccion-resumen'); s.classList.toggle('hidden');
            e.currentTarget.innerHTML = s.classList.contains('hidden') ? '<i class="fa-solid fa-chart-simple mr-1"></i> Ver Resumen' : '<i class="fa-solid fa-eye-slash mr-1"></i> Ocultar';
        };

        const fMoneda = (n) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(n);

        async function cargarTodo() {
            try {
                const { data: presupuestos } = await supabaseClient.from('presupuestos').select('*').eq('mes_anio', mesSeleccionado);
                const { data: movimientos } = await supabaseClient.from('movimientos').select('*').gte('fecha', mesSeleccionado+"-01").lt('fecha', mesSeleccionado+"-31").order('fecha', {ascending:false}).order('created_at', {ascending:false});
                
                let i=0, g=0, a=0, gCat={};
                (movimientos||[]).forEach(m => {
                    if(m.tipo==='Ingreso') i+=parseFloat(m.monto);
                    else { if(m.categoria==='Ahorro') a+=parseFloat(m.monto); else g+=parseFloat(m.monto); gCat[m.categoria]=(gCat[m.categoria]||0)+parseFloat(m.monto); }
                });

                document.getElementById('txt-total-ingresos').innerText = fMoneda(i);
                document.getElementById('txt-total-gastos').innerText = fMoneda(g);
                document.getElementById('txt-total-ahorros').innerText = fMoneda(a);
                document.getElementById('txt-disponible').innerText = fMoneda(i-g-a);

                const conPre = document.getElementById('contenedor-presupuestos'); conPre.innerHTML = '';
                (presupuestos||[]).forEach(p => {
                    const totalG = gCat[p.categoria]||0, lim = parseFloat(p.limite), res = lim - totalG;
                    conPre.innerHTML += `<div class="bg-gray-800/80 p-4 rounded-2xl border border-gray-700 shadow-sm space-y-1">
                        <div class="flex justify-between text-xs text-gray-400 font-bold">${p.categoria} <button onclick="borrarPresupuesto('${p.id}')" class="text-red-500"><i class="fa-solid fa-trash-can"></i></button></div>
                        <div class="text-xl font-black text-white">${fMoneda(totalG)} <span class="text-[10px] text-gray-500 font-normal">/ ${fMoneda(limite)}</span></div>
                        <div class="text-[10px] text-center font-bold py-1 rounded-lg ${res<=0?'bg-red-900':'bg-green-900'}">${res<=0?'¡Límite superado!':'Quedan '+fMoneda(res)}</div>
                    </div>`;
                });

                const lista = document.getElementById('lista-movimientos'); lista.innerHTML = '';
                (movimientos||[]).forEach(m => {
                    lista.innerHTML += `<div class="bg-gray-800/50 p-3 rounded-xl flex justify-between items-center border border-gray-700 text-xs">
                        <div><p class="font-bold text-gray-200">${m.detalle||m.categoria}</p><p class="text-[10px] text-gray-500">${m.fecha}</p></div>
                        <div class="flex items-center gap-3"><p class="font-bold ${m.tipo==='Ingreso'?'text-green-400':'text-gray-200'}">${m.tipo==='Ingreso'?'+':'-'}${fMoneda(m.monto)}</p>
                        <button onclick="borrarMovimiento('${m.id}')" class="text-gray-500 hover:text-red-400"><i class="fa-solid fa-trash-can"></i></button></div>
                    </div>`;
                });
            } catch (err) { console.error(err); }
        }

        window.borrarMovimiento = async (id) => { if(confirm("¿Borrar?")) { await supabaseClient.from('movimientos').delete().eq('id', id); cargarTodo(); } };
        window.borrarPresupuesto = async (id) => { if(confirm("¿Borrar tope?")) { await supabaseClient.from('presupuestos').delete().eq('id', id); cargarTodo(); } };

        document.getElementById('form-movimiento').onsubmit = async (e) => {
            e.preventDefault();
            await supabaseClient.from('movimientos').insert([{ tipo: tipoSeleccionado, monto: document.getElementById('input-monto').value, categoria: document.getElementById('input-categoria').value, detalle: document.getElementById('input-detalle').value, fecha: new Date().toISOString().split('T')[0] }]);
            e.target.reset(); document.getElementById('modal-carga').classList.replace('flex', 'hidden'); cargarTodo();
        };

        document.getElementById('form-config').onsubmit = async (e) => {
            e.preventDefault();
            await supabaseClient.from('presupuestos').insert([{ mes_anio: mesSeleccionado, categoria: document.getElementById('cfg-categoria').value, limite: document.getElementById('cfg-monto').value }]);
            e.target.reset(); document.getElementById('modal-config').classList.replace('flex', 'hidden'); cargarTodo();
        };

        window.onload = () => { inicializarSelector(); cargarTodo(); };
    </script>
</body>
</html>
