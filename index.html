<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Contabilidad</title>
    <link rel="manifest" href="/Contabilidad-Casa/manifest.json">
    <meta name="theme-color" content="#030712">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .fondo-personalizado {
            background-image: url('fondo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .capa-oscura {
            background-color: rgba(3, 7, 18, 0.85);
            min-height: 100vh;
        }
    </style>
</head>
<body class="fondo-personalizado">
    <div class="capa-oscura min-h-screen pb-24">

        <header class="bg-gray-900/50 border-b border-gray-700 p-4 sticky top-0 z-10 backdrop-blur-sm">
            <div class="max-w-md mx-auto flex justify-between items-center">
                <h1 class="text-base font-bold tracking-wide text-indigo-400">🏡 Fondo Común</h1>
                <select id="select-mes-filtro" class="bg-gray-900 border border-gray-700 text-indigo-300 text-xs px-2 py-1 rounded-full font-bold focus:outline-none">
                </select>
            </div>
        </header>

        <main class="max-w-md mx-auto p-4 space-y-6">

            <section class="bg-gray-800/80 p-5 rounded-2xl border border-gray-700 shadow-xl text-center">
                <p class="text-xs uppercase tracking-wider text-gray-400 font-bold mb-1">Disponible en Mano</p>
                <p class="text-4xl font-black text-white mb-4 tracking-tight" id="txt-disponible">$0</p>
                
                <div class="grid grid-cols-3 gap-2 pt-3 border-t border-gray-700">
                    <div>
                        <p class="text-[11px] text-gray-400 font-medium">Ingresó</p>
                        <p class="text-sm font-bold text-green-400 mt-0.5" id="txt-total-ingresos">$0</p>
                    </div>
                    <div class="border-l border-gray-700">
                        <p class="text-[11px] text-gray-400 font-medium">Salió</p>
                        <p class="text-sm font-bold text-red-400 mt-0.5" id="txt-total-gastos">$0</p>
                    </div>
                    <div class="border-l border-gray-700">
                        <p class="text-[11px] text-gray-400 font-medium">Ahorro</p>
                        <p class="text-sm font-bold text-indigo-400 mt-0.5" id="txt-total-ahorros">$0</p>
                    </div>
                </div>
            </section>

            <section class="space-y-4">
                <div class="flex justify-between items-center pl-1">
                    <h2 class="text-xs uppercase tracking-wider text-gray-400 font-black">Límites y Alertas</h2>
                    <button id="btn-config-limite" class="text-xs font-bold text-indigo-400 hover:underline">
                        <i class="fa-solid fa-plus mr-1"></i>Agregar Tope
                    </button>
                </div>
                <div id="contenedor-presupuestos" class="space-y-3">
                    <p class="text-sm text-gray-500 italic pl-1">Cargando cuentas...</p>
                </div>
            </section>

            <div class="text-center">
                <button id="btn-toggle-resumen" class="text-xs font-bold text-indigo-400 bg-gray-800 border border-gray-700 px-4 py-2.5 rounded-xl transition active:bg-gray-700 shadow-sm">
                    <i class="fa-solid fa-chart-simple mr-1"></i> Ver Resumen Completo
                </button>
            </div>

            <section id="seccion-resumen" class="hidden space-y-3 pt-2">
                <h2 class="text-xs uppercase tracking-wider text-gray-400 font-black pl-1">Historial del Mes Seleccionado</h2>
                <div id="lista-movimientos" class="space-y-2"></div>
            </section>
        </main>

        <button id="btn-abrir-modal" class="fixed bottom-6 right-6 bg-indigo-600 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-2xl active:scale-90 transition-transform z-20">
            <i class="fa-solid fa-plus"></i>
        </button>

        <div id="modal-carga" class="fixed inset-0 bg-black/70 hidden items-end sm:items-center justify-center p-4 z-30 shadow-2xl">
            <div class="bg-gray-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 space-y-4 border-t border-gray-700 sm:border">
                <div class="flex justify-between items-center border-b border-gray-700 pb-2">
                    <h3 class="text-base font-bold text-white">Nuevo Registro</h3>
                    <button type="button" id="btn-cerrar-modal" class="text-gray-400 hover:text-white text-xl px-2 py-1"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form id="form-movimiento" class="space-y-4">
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" id="btn-tipo-gasto" class="py-2.5 rounded-xl font-bold border border-red-500 bg-red-500/10 text-red-400 text-center">Gasto</button>
                        <button type="button" id="btn-tipo-ingreso" class="py-2.5 rounded-xl font-bold border border-gray-700 bg-transparent text-gray-400 text-center">Ingreso</button>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Monto ($)</label>
                        <input type="number" id="input-monto" required inputmode="decimal" placeholder="0" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl text-lg font-bold text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Categoría</label>
                        <select id="input-categoria" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl text-white text-sm focus:outline-none">
                            <option value="Gasto de Casa">🏠 Gasto de Casa</option>
                            <option value="Combustible">🚗 Combustible</option>
                            <option value="Fijos / Servicios">📄 Fijos / Servicios</option>
                            <option value="Ahorro">🐷 Ahorro</option>
                            <option value="Sueldo">💰 Ingreso / Sueldo</option>
                            <option value="Otros">💡 Otros</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Nota / Detalle corto</label>
                        <input type="text" id="input-detalle" placeholder="Ej: Carnicería, Nafta" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl text-white text-sm focus:outline-none">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-bold shadow-lg">Guardar Registro</button>
                </form>
            </div>
        </div>

        <div id="modal-config" class="fixed inset-0 bg-black/70 hidden items-end sm:items-center justify-center p-4 z-30 shadow-2xl">
            <div class="bg-gray-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 space-y-4 border-t border-gray-700 sm:border">
                <div class="flex justify-between items-center border-b border-gray-700 pb-2">
                    <h3 class="text-base font-bold text-white">Agregar Límite de Gasto</h3>
                    <button type="button" id="btn-cerrar-config" class="text-gray-400 hover:text-white text-xl px-2 py-1"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form id="form-config" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Categoría del Límite</label>
                        <select id="cfg-categoria" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl text-white text-sm focus:outline-none">
                            <option value="Gasto de Casa">🏠 Gasto de Casa</option>
                            <option value="Combustible">🚗 Combustible</option>
                            <option value="Fijos / Servicios">📄 Fijos / Servicios</option>
                            <option value="Ahorro">🐷 Ahorro</option>
                            <option value="Otros">💡 Otros</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Monto Máximo Mensual ($)</label>
                        <input type="number" id="cfg-monto" required placeholder="Ej: 150000" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl text-white font-bold focus:outline-none">
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white py-3.5 rounded-xl font-bold shadow-lg">Establecer Límite</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wyqdlihwnwhcsonyspms.supabase.co";
        const SUPABASE_KEY = "sb_publishable_6UD99xo9Z11VXHj1ie2DFg_xjPXQhe6"; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let tipoSeleccionado = 'Gasto';
        let mesSeleccionado = "";

        function inicializarSelectorMeses() {
            const selector = document.getElementById('select-mes-filtro');
            const hoy = new Date();
            mesSeleccionado = hoy.toISOString().slice(0, 7);
            const nombresMeses = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
            for (let i = -4; i <= 2; i++) {
                let d = new Date(hoy.getFullYear(), hoy.getMonth() + i, 1);
                let val = d.toISOString().slice(0, 7);
                let opt = document.createElement('option');
                opt.value = val; opt.innerText = `${nombresMeses[d.getMonth()]} ${d.getFullYear()}`;
                if (val === mesSeleccionado) opt.selected = true;
                selector.appendChild(opt);
            }
            selector.addEventListener('change', (e) => { mesSeleccionado = e.target.value; cargarTodo(); });
        }

        document.getElementById('btn-abrir-modal').addEventListener('click', () => document.getElementById('modal-carga').classList.replace('hidden', 'flex'));
        document.getElementById('btn-cerrar-modal').addEventListener('click', () => document.getElementById('modal-carga').classList.replace('flex', 'hidden'));
        document.getElementById('btn-cerrar-config').addEventListener('click', () => document.getElementById('modal-config').classList.replace('flex', 'hidden'));
        document.getElementById('btn-config-limite').addEventListener('click', () => document.getElementById('modal-config').classList.replace('hidden', 'flex'));

        const btnGasto = document.getElementById('btn-tipo-gasto');
        const btnIngreso = document.getElementById('btn-tipo-ingreso');
        btnGasto.addEventListener('click', () => { tipoSeleccionado = 'Gasto'; btnGasto.className = "py-2.5 rounded-xl font-bold border border-red-500 bg-red-500/10 text-red-400 text-center"; btnIngreso.className = "py-2.5 rounded-xl font-bold border border-gray-700 bg-transparent text-gray-400 text-center"; });
        btnIngreso.addEventListener('click', () => { tipoSeleccionado = 'Ingreso'; btnIngreso.className = "py-2.5 rounded-xl font-bold border border-green-500 bg-green-500/10 text-green-400 text-center"; btnGasto.className = "py-2.5 rounded-xl font-bold border border-gray-700 bg-transparent text-gray-400 text-center"; });

        document.getElementById('btn-toggle-resumen').addEventListener('click', (e) => {
            const seccion = document.getElementById('seccion-resumen');
            seccion.classList.toggle('hidden');
            e.currentTarget.innerHTML = seccion.classList.contains('hidden') ? '<i class="fa-solid fa-chart-simple mr-1"></i> Ver Resumen Completo' : '<i class="fa-solid fa-eye-slash mr-1"></i> Ocultar Resumen';
        });

        const fMoneda = (num) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(num);

        async function cargarTodo() {
            try {
                let { data: presupuestos, error: errP } = await supabaseClient.from('presupuestos').select('*').eq('mes_anio', mesSeleccionado);
                const primerDia = `${mesSeleccionado}-01`;
                let dSeg = new Date(mesSeleccionado.split('-')[0], mesSeleccionado.split('-')[1], 1);
                const primerDiaSiguiente = dSeg.toISOString().slice(0, 7) + "-01";

                let { data: movimientos, error: errM } = await supabaseClient.from('movimientos')
                    .select('*').gte('fecha', primerDia).lt('fecha', primerDiaSiguiente)
                    .order('fecha', { ascending: false }).order('created_at', { ascending: false });

                movimientos = movimientos || []; presupuestos = presupuestos || [];

                let ingresos = 0, gastos = 0, ahorros = 0, gastosPorCategoria = {};
                movimientos.forEach(m => {
                    const monto = parseFloat(m.monto);
                    if (m.tipo === 'Ingreso') ingresos += monto;
                    else {
                        if (m.categoria === 'Ahorro') ahorros += monto;
                        else gastos += monto;
                        gastosPorCategoria[m.categoria] = (gastosPorCategoria[m.categoria] || 0) + monto;
                    }
                });

                document.getElementById('txt-total-ingresos').innerText = fMoneda(ingresos);
                document.getElementById('txt-total-gastos').innerText = fMoneda(gastos);
                document.getElementById('txt-total-ahorros').innerText = fMoneda(ahorros);
                document.getElementById('txt-disponible').innerText = fMoneda(ingresos - gastos - ahorros);

                const contenedorPre = document.getElementById('contenedor-presupuestos');
                contenedorPre.innerHTML = '';
                if (presupuestos.length === 0) {
                    contenedorPre.innerHTML = `<div class="bg-gray-800/40 border border-dashed border-gray-700 rounded-2xl p-6 text-center text-sm text-gray-400">No hay topes configurados.</div>`;
                } else {
                    presupuestos.forEach(p => {
                        const totalGastado = gastosPorCategoria[p.categoria] || 0;
                        const limite = parseFloat(p.limite); const restante = limite - totalGastado;
                        let colorAlerta = restante <= 0 ? "bg-red-500/20 text-red-400 border-red-500/40 font-black animate-pulse" : (restante <= (limite * 0.15) ? "bg-amber-500/20 text-amber-400 border-amber-500/40" : "bg-green-500/10 text-green-400 border-green-500/20");
                        contenedorPre.innerHTML += `
                            <div class="bg-gray-800/80 p-4 rounded-2xl border border-gray-700 shadow-sm space-y-1">
                                <div class="flex justify-between items-center text-xs text-gray-400">
                                    <span class="font-bold text-gray-200">${p.categoria}</span>
                                    <button onclick="borrarPresupuesto('${p.id}')" class="text-gray-500 hover:text-red-400"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                                <div class="text-xl font-black text-white">${fMoneda(totalGastado)} <span class="text-xs font-normal text-gray-500">/ ${fMoneda(limite)}</span></div>
                                <div class="text-[10px] py-1 rounded-lg border ${colorAlerta} text-center font-bold">${restante <= 0 ? '¡Límite superado!' : 'Te quedan ' + fMoneda(restante)}</div>
                            </div>`;
                    });
                }

                const listaHTML = document.getElementById('lista-movimientos'); listaHTML.innerHTML = '';
                movimientos.forEach(m => {
                    listaHTML.innerHTML += `
                        <div class="bg-gray-800/50 p-3 rounded-xl flex justify-between items-center border border-gray-700/50 text-xs">
                            <div class="flex items-center gap-3">
                                <div><p class="font-bold text-gray-200">${m.detalle || m.categoria}</p><p class="text-[10px] text-gray-500">${m.fecha}</p></div>
                            </div>
                            <div class="flex items-center gap-3">
                                <p class="font-bold ${m.tipo === 'Ingreso' ? 'text-green-400' : 'text-gray-200'}">${m.tipo === 'Ingreso' ? '+' : '-'}${fMoneda(m.monto)}</p>
                                <button onclick="borrarMovimiento('${m.id}')" class="text-gray-500 hover:text-red-400"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>`;
                });
            } catch (err) { console.error(err); }
        }

        window.borrarMovimiento = async (id) => { if(confirm("¿Borrar?")) { await supabaseClient.from('movimientos').delete().eq('id', id); cargarTodo(); } };
        window.borrarPresupuesto = async (id) => { if(confirm("¿Borrar tope?")) { await supabaseClient.from('presupuestos').delete().eq('id', id); cargarTodo(); } };

        document.getElementById('form-movimiento').addEventListener('submit', async (e) => {
            e.preventDefault();
            await supabaseClient.from('movimientos').insert([{ 
                tipo: tipoSeleccionado, monto: document.getElementById('input-monto').value, 
                categoria: document.getElementById('input-categoria').value, 
                detalle: document.getElementById('input-detalle').value, fecha: new Date().toISOString().split('T')[0]
            }]);
            e.target.reset(); document.getElementById('modal-carga').classList.replace('flex', 'hidden'); cargarTodo();
        });

        document.getElementById('form-config').addEventListener('submit', async (e) => {
            e.preventDefault();
            await supabaseClient.from('presupuestos').insert([{ 
                mes_anio: mesSeleccionado, categoria: document.getElementById('cfg-categoria').value, 
                limite: document.getElementById('cfg-monto').value 
            }]);
            e.target.reset(); document.getElementById('modal-config').classList.replace('flex', 'hidden'); cargarTodo();
        });

        window.addEventListener('DOMContentLoaded', () => { inicializarSelectorMeses(); cargarTodo(); });
    </script>
</body>
</html>
